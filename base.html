<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Recruiter | AI Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: white; border-bottom: 1px solid #e2e8f0; }
        .auth-card { border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border: none; }
        footer { margin-top: auto; border-top: 1px solid #e2e8f0; background: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/"><i class="bi bi-robot me-2"></i>SMART RECRUITER</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="text-decoration-none text-muted me-3">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-primary btn-sm rounded-pill px-4">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-5">
    {% block content %}{% endblock %}
</div>

<footer class="py-4 mt-auto">
    <div class="container text-center text-muted small">
        &copy; 2026 Smart Recruiter Project. Powered by Gemini 3 Flash.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
